<span class="inline-flex items-center gap-1.5 text-xs font-medium
    {% if movimiento.estado == 'aplicado' %}text-emerald-600
    {% elif movimiento.estado == 'cancelado' %}text-red-500
    {% else %}text-gray-500{% endif %}">
    <span class="w-1.5 h-1.5 rounded-full
        {% if movimiento.estado == 'aplicado' %}bg-emerald-500
        {% elif movimiento.estado == 'cancelado' %}bg-red-400
        {% else %}bg-gray-400{% endif %}"></span>
    {{ movimiento.get_estado_display }}
</span>
