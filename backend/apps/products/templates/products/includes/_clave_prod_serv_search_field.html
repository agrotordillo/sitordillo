{% load product_extras %}
<div class="clave-prod-serv-search relative" data-clave-prod-serv-search-url="{% url 'api:clave-prod-serv-buscar' %}">
  {{ form.clave_prod_serv_sat }}
  <input type="text" class="input clave-prod-serv-search-input" placeholder="Clave o descripción del producto/servicio..." value="{{ form.clave_prod_serv_sat.value|clave_prod_serv_label }}" autocomplete="off">
  <div class="clave-prod-serv-search-results hidden absolute z-20 mt-1.5 w-full bg-white border border-gray-100 rounded-xl shadow-xl ring-1 ring-black/5 max-h-64 overflow-y-auto divide-y divide-gray-50"></div>
</div>
{% if form.clave_prod_serv_sat.errors %}<p class="mt-1 text-xs text-red-600">{{ form.clave_prod_serv_sat.errors.0 }}</p>{% endif %}
