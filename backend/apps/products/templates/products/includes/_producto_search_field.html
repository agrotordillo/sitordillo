{% load product_extras %}
<div
  class="producto-search relative"
  data-producto-search-url="{% url 'api:producto-buscar' %}"
  {% if almacen_field_id %}data-producto-search-almacen-field="{{ almacen_field_id }}"{% endif %}
>
  {{ form.producto }}
  <input type="text" class="input producto-search-input" placeholder="Folio, SKU, código o nombre..." value="{{ form.producto.value|producto_label }}" autocomplete="off">
  <div class="producto-search-results hidden z-[55] bg-white border border-gray-100 rounded-xl shadow-xl ring-1 ring-black/5 max-h-64 overflow-y-auto divide-y divide-gray-50"></div>
</div>
{% if form.producto.errors %}<p class="mt-1 text-xs text-red-600">{{ form.producto.errors.0 }}</p>{% endif %}
