{% load product_extras %}
<div class="producto-search relative" data-producto-search-url="{% url 'api:producto-buscar' %}">
  {{ form.producto }}
  <input type="text" class="input producto-search-input" placeholder="Folio, SKU, código o nombre..." value="{{ form.producto.value|producto_label }}" autocomplete="off">
  <div class="producto-search-results hidden absolute z-20 mt-1 w-full bg-white border border-gray-200 rounded-lg shadow-lg max-h-56 overflow-y-auto"></div>
</div>
{% if form.producto.errors %}<p class="mt-1 text-xs text-red-600">{{ form.producto.errors.0 }}</p>{% endif %}
