{% comment %}
Modal de confirmación compartido para "Actualizar precio de costo" (ver
precio-alerta.js): se abre disparando el evento de window
"confirmar-costo:abrir" con detail {nombre, anterior, nuevo, onConfirmar}.
{% endcomment %}
<div
  x-data="{
    open: false, nombre: '', anterior: '', nuevo: '', _onConfirmar: null,
    abrir(detalle) {
      this.nombre = detalle.nombre;
      this.anterior = detalle.anterior;
      this.nuevo = detalle.nuevo;
      this._onConfirmar = detalle.onConfirmar;
      this.open = true;
    },
    confirmar() {
      this.open = false;
      if (this._onConfirmar) this._onConfirmar();
    },
  }"
  @confirmar-costo:abrir.window="abrir($event.detail)"
>
  <template x-teleport="body">
    <div x-show="open" x-cloak>
      <div
        class="modal-backdrop"
        @click="open = false"
        x-transition:enter="motion-ui-fade-enter-active"
        x-transition:enter-start="motion-ui-fade-enter-from"
        x-transition:enter-end="motion-ui-fade-enter-to"
        x-transition:leave="motion-ui-fade-leave-active"
        x-transition:leave-start="motion-ui-fade-leave-from"
        x-transition:leave-end="motion-ui-fade-leave-to"
      ></div>
      <div class="modal-shell" @keydown.escape.window="open = false">
        <div
          class="modal-panel"
          @click.stop
          x-transition:enter="motion-ui-panel-enter-active"
          x-transition:enter-start="motion-ui-panel-enter-from"
          x-transition:enter-end="motion-ui-panel-enter-to"
          x-transition:leave="motion-ui-panel-leave-active"
          x-transition:leave-start="motion-ui-panel-leave-from"
          x-transition:leave-end="motion-ui-panel-leave-to"
        >
          <header class="modal-header">
            <h3 class="text-sm font-semibold text-gray-800">Actualizar precio de costo</h3>
            <button type="button" class="btn-icon" @click="open = false" aria-label="Cerrar">
              <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/></svg>
            </button>
          </header>
          <div class="modal-body">
            <p class="text-sm text-gray-600 mb-3" x-text="nombre"></p>
            <div class="flex items-center gap-3 text-sm">
              <div>
                <p class="text-xs text-gray-400">Costo actual</p>
                <p class="font-medium text-gray-700" x-text="'$' + anterior"></p>
              </div>
              <svg class="w-4 h-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 10a.75.75 0 0 1 .75-.75h10.638L10.23 5.29a.75.75 0 1 1 1.04-1.08l5.5 5.25a.75.75 0 0 1 0 1.08l-5.5 5.25a.75.75 0 1 1-1.04-1.08l4.158-3.96H3.75A.75.75 0 0 1 3 10Z" clip-rule="evenodd" /></svg>
              <div>
                <p class="text-xs text-gray-400">Costo nuevo</p>
                <p class="font-semibold text-primary-600" x-text="'$' + nuevo"></p>
              </div>
            </div>
            <p class="mt-3 text-xs text-gray-400">Esto actualiza el precio de costo del producto en todo el sistema, no solo en esta orden.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary" @click="open = false">Cancelar</button>
            <button type="button" class="btn-primary" @click="confirmar()">Confirmar</button>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
